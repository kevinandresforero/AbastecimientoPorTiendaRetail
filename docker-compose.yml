# Un contenedor por servicio, orquestados juntos (un solo comando levanta los tres):  docker compose up -d --build
#   db    -> SQL Server 2022 (localhost:14333)
#   api   -> ASP.NET Core 8 (http://localhost:8080); aplica las migraciones y la semilla al arrancar
#   front -> Blazor Web App .NET 8 (http://localhost:3000); consume la API por HTTP (servidor a servidor, sin CORS)
#   pruebas -> (perfil "pruebas") ejecuta TODAS las pruebas (backend y front) con .NET 8:
#              docker compose --profile pruebas run --rm pruebas
#
# Redes: "datos" une db y api; "web" une api y front. El front solo ve a la API: no puede alcanzar la base de datos.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: abastecimiento-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Abastecimiento#2026}
    ports:
      - "${SQL_PUERTO:-14333}:1433"
    volumes:
      - datos-sql:/var/opt/mssql
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Abastecimiento.Api/Dockerfile
    container_name: abastecimiento-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Abastecimiento: "Server=db,1433;Database=Abastecimiento;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Abastecimiento#2026};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    networks:
      - datos
      - web
    restart: on-failure

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: abastecimiento-front
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__UrlBase: "http://api:8080"
    ports:
      - "3000:8080"
    networks:
      - web
    restart: on-failure

  # Solo con el perfil "pruebas": backend (unitarias + integracion en la BD Abastecimiento_Pruebas) y luego el front.
  # El repo se monta solo lectura y se copia sin .git, .claude, bin, obj ni .env para compilar limpio.
  pruebas:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["pruebas"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ABASTECIMIENTO_PRUEBAS_SQL: "Server=db,1433;Database=Abastecimiento_Pruebas;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Abastecimiento#2026};TrustServerCertificate=True"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - .:/src:ro
      - nuget-cache:/root/.nuget/packages
    networks:
      - datos
    command:
      - bash
      - -c
      - >-
        mkdir -p /tmp/build &&
        tar -C /src --exclude=./.git --exclude=./.claude --exclude=./.env --exclude='*/bin' --exclude='*/obj' -cf - . | tar -C /tmp/build -xf - &&
        cd /tmp/build &&
        dotnet test Abastecimiento.sln --logger "console;verbosity=normal" &&
        dotnet test front/Abastecimiento.Front.sln --logger "console;verbosity=normal"

networks:
  datos:
  web:

volumes:
  datos-sql:
  nuget-cache:
